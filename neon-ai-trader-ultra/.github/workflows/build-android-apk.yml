name: Build Android APK (NEON AI TRADER ULTRA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java 17 (required by Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install frontend dependencies and build web bundle
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Generate Capacitor Android project
        working-directory: frontend
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug Android APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload NEON AI TRADER ULTRA APK
        uses: actions/upload-artifact@v4
        with:
          name: neon-ai-trader-ultra-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
