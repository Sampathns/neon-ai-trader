version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: neon_trader
      POSTGRES_USER: neon
      POSTGRES_PASSWORD: ${NEON_PG_PASSWORD:-change-me-in-production}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEON_ENV: production
      NEON_DATABASE_URL: sqlite:///./data/neon_trader.db
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_data:
